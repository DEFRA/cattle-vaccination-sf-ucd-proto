<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 720" font-family="Arial, Helvetica, sans-serif">
  <rect width="1140" height="720" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0b0c0c">Cheatsheet — Log a Vaccination (Screen Flow)</text>
  <text x="24" y="54" font-size="12" fill="#5c5c5c">What a designer can change with standard Salesforce config (no code).</text>

  <!-- ===================== WIREFRAME ===================== -->
  <g>
    <rect x="24" y="70" width="600" height="624" rx="6" fill="#f3f4f4" stroke="#c9c9c9"/>

    <!-- green nav -->
    <rect x="24" y="70" width="600" height="28" fill="#008938"/>
    <text x="40" y="88" font-size="11" font-weight="700" fill="#ffffff">Bovine TB</text>

    <!-- flow card -->
    <rect x="140" y="118" width="368" height="552" rx="6" fill="#ffffff" stroke="#cfcfcf"/>
    <!-- flow header -->
    <rect x="140" y="118" width="368" height="48" rx="6" fill="#f3f3f3"/>
    <rect x="156" y="130" width="22" height="22" rx="4" fill="#9050e9"/>
    <text x="188" y="140" font-size="12" font-weight="700" fill="#0b0c0c">Log a Vaccination</text>
    <text x="188" y="154" font-size="8.5" fill="#5c5c5c">Step 1 of 2 · Vaccination details</text>

    <!-- progress bar -->
    <circle cx="300" cy="184" r="5" fill="#008938"/><line x1="305" y1="184" x2="345" y2="184" stroke="#d8d8d8" stroke-width="2"/><circle cx="350" cy="184" r="5" fill="#ffffff" stroke="#b9b9b9"/>

    <!-- animal context -->
    <rect x="156" y="200" width="336" height="30" rx="4" fill="#f3f3f3" stroke="#e3e3e3"/>
    <text x="166" y="213" font-size="7.5" fill="#5c5c5c">ANIMAL</text>
    <text x="166" y="225" font-size="9.5" fill="#0b0c0c">UK58291000125 · HER · Female</text>

    <!-- field: who -->
    <text x="156" y="252" font-size="9" fill="#0b0c0c">* Who vaccinated the cattle?</text>
    <rect x="156" y="258" width="336" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
    <text x="166" y="273" font-size="9" fill="#0b0c0c">I did (Dave)</text><text x="480" y="273" font-size="9" fill="#888">▾</text>

    <!-- field: date -->
    <text x="156" y="300" font-size="9" fill="#0b0c0c">* Date of vaccination</text>
    <rect x="156" y="306" width="150" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
    <text x="166" y="321" font-size="9" fill="#0b0c0c">12/06/2026</text><text x="294" y="321" font-size="9" fill="#888">▦</text>

    <!-- section vaccine batch -->
    <text x="156" y="350" font-size="8.5" font-weight="700" fill="#5c5c5c">VACCINE BATCH DETAILS</text>
    <line x1="156" y1="356" x2="492" y2="356" stroke="#e3e3e3"/>
    <text x="156" y="374" font-size="9" fill="#0b0c0c">* Vaccine batch number</text>
    <rect x="156" y="380" width="200" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
    <text x="166" y="395" font-size="9" fill="#9a9a9a">For example, 125007G</text>
    <text x="156" y="422" font-size="9" fill="#0b0c0c">* Vaccine expiry date</text>
    <rect x="156" y="428" width="96" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9"/><text x="166" y="443" font-size="9" fill="#0b0c0c">Month</text><text x="238" y="443" font-size="9" fill="#888">▾</text>
    <rect x="258" y="428" width="96" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9"/><text x="268" y="443" font-size="9" fill="#0b0c0c">Year</text><text x="340" y="443" font-size="9" fill="#888">▾</text>
    <text x="156" y="464" font-size="8" fill="#9a9a9a">For example, 05 2029</text>

    <!-- section diluent batch -->
    <text x="156" y="488" font-size="8.5" font-weight="700" fill="#5c5c5c">DILUENT BATCH DETAILS</text>
    <line x1="156" y1="494" x2="492" y2="494" stroke="#e3e3e3"/>
    <text x="156" y="512" font-size="9" fill="#0b0c0c">* Diluent batch number</text>
    <rect x="156" y="518" width="200" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9"/>
    <text x="166" y="533" font-size="9" fill="#9a9a9a">For example, 37925B</text>
    <text x="156" y="560" font-size="9" fill="#0b0c0c">* Diluent expiry date</text>
    <rect x="156" y="566" width="96" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9"/><text x="166" y="581" font-size="9" fill="#0b0c0c">Month</text><text x="238" y="581" font-size="9" fill="#888">▾</text>
    <rect x="258" y="566" width="96" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9"/><text x="268" y="581" font-size="9" fill="#0b0c0c">Year</text><text x="340" y="581" font-size="9" fill="#888">▾</text>

    <!-- footer -->
    <line x1="140" y1="624" x2="508" y2="624" stroke="#e3e3e3"/>
    <rect x="156" y="636" width="60" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9"/><text x="186" y="651" font-size="9" fill="#0b0c0c" text-anchor="middle">Cancel</text>
    <rect x="380" y="636" width="56" height="22" rx="4" fill="#ffffff" stroke="#b9b9b9"/><text x="408" y="651" font-size="9" fill="#0b0c0c" text-anchor="middle">Previous</text>
    <rect x="442" y="636" width="50" height="22" rx="4" fill="#008938"/><text x="467" y="651" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">Next</text>

    <!-- annotation pins -->
    <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      <circle cx="140" cy="118" r="11" fill="#2e844a"/><text x="140" y="122">1</text>
      <circle cx="188" cy="128" r="11" fill="#2e844a"/><text x="188" y="132">2</text>
      <circle cx="325" cy="184" r="11" fill="#9a6a00"/><text x="325" y="188">3</text>
      <circle cx="156" cy="200" r="11" fill="#2e844a"/><text x="156" y="204">4</text>
      <circle cx="500" cy="269" r="11" fill="#2e844a"/><text x="500" y="273">5</text>
      <circle cx="324" cy="434" r="11" fill="#9a6a00"/><text x="324" y="438">6</text>
      <circle cx="156" cy="344" r="11" fill="#2e844a"/><text x="156" y="348">7</text>
      <circle cx="467" cy="636" r="11" fill="#2e844a"/><text x="467" y="640">8</text>
    </g>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g>
    <text x="660" y="86" font-size="13" font-weight="700" fill="#0b0c0c">What you can change</text>
    <circle cx="666" cy="104" r="6" fill="#2e844a"/><text x="678" y="108" font-size="10" fill="#444">Configurable</text>
    <circle cx="788" cy="104" r="6" fill="#9a6a00"/><text x="800" y="108" font-size="10" fill="#444">Partial</text>
    <circle cx="880" cy="104" r="6" fill="#ba0517"/><text x="892" y="108" font-size="10" fill="#444">Needs code</text>

    <g font-size="11.5">
      <circle cx="668" cy="138" r="10" fill="#2e844a"/><text x="668" y="142" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <text x="688" y="135" font-weight="700" fill="#0b0c0c">The whole flow</text>
      <text x="688" y="150" fill="#5c5c5c">Build it in Flow Builder (Screen Flow) — entirely no-code.</text>

      <circle cx="668" cy="178" r="10" fill="#2e844a"/><text x="668" y="182" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <text x="688" y="175" font-weight="700" fill="#0b0c0c">Flow / screen title</text>
      <text x="688" y="190" fill="#5c5c5c">Set the screen label and headings in Flow Builder.</text>

      <circle cx="668" cy="218" r="10" fill="#9a6a00"/><text x="668" y="222" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text>
      <text x="688" y="215" font-weight="700" fill="#0b0c0c">Progress indicator</text>
      <text x="688" y="230" fill="#5c5c5c">Optional — toggle “show progress” / add stages in the flow.</text>

      <circle cx="668" cy="258" r="10" fill="#2e844a"/><text x="668" y="262" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text>
      <text x="688" y="255" font-weight="700" fill="#0b0c0c">Read-only context</text>
      <text x="688" y="270" fill="#5c5c5c">Display the launched record’s fields (Display Text / fields).</text>

      <circle cx="668" cy="298" r="10" fill="#2e844a"/><text x="668" y="302" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">5</text>
      <text x="688" y="295" font-weight="700" fill="#0b0c0c">Fields, labels, required, help text</text>
      <text x="688" y="310" fill="#5c5c5c">Add screen components; mark required; set “For example…” help.</text>

      <circle cx="668" cy="338" r="10" fill="#9a6a00"/><text x="668" y="342" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">6</text>
      <text x="688" y="335" font-weight="700" fill="#0b0c0c">Date &amp; picklist inputs</text>
      <text x="688" y="350" fill="#5c5c5c">Rendered by field type. No month-only picker → two picklists.</text>

      <circle cx="668" cy="378" r="10" fill="#2e844a"/><text x="668" y="382" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">7</text>
      <text x="688" y="375" font-weight="700" fill="#0b0c0c">Section headings / grouping</text>
      <text x="688" y="390" fill="#5c5c5c">Section components group fields on the flow screen.</text>

      <circle cx="668" cy="418" r="10" fill="#2e844a"/><text x="668" y="422" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">8</text>
      <text x="688" y="415" font-weight="700" fill="#0b0c0c">Navigation footer</text>
      <text x="688" y="430" fill="#5c5c5c">Previous / Next / Finish are standard and automatic.</text>
    </g>

    <rect x="660" y="468" width="452" height="120" rx="6" fill="#fef6f6" stroke="#f3c4c4"/>
    <text x="676" y="490" font-size="11.5" font-weight="700" fill="#ba0517">Can’t change without code</text>
    <text x="676" y="508" font-size="11" fill="#5c5c5c">• Three-box Day/Month/Year date entry (GOV.UK style)</text>
    <text x="676" y="524" font-size="11" fill="#5c5c5c">• A true month-only or custom date control</text>
    <text x="676" y="540" font-size="11" fill="#5c5c5c">• Toggle switches (checkbox fields render as checkboxes)</text>
    <text x="676" y="556" font-size="11" fill="#5c5c5c">• Custom field layout, colours, or fonts on the screen</text>
    <text x="676" y="572" font-size="11" fill="#5c5c5c">• Inline-editable grid to log many animals at once</text>
  </g>
</svg>
