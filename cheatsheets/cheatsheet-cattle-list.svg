<svg font-family="Arial, Helvetica, sans-serif" viewBox="0 0 1140 720" xmlns="http://www.w3.org/2000/svg"><path d="m0 0h1140v720h-1140z" fill="#fff"/><text fill="#0b0c0c" font-size="20" font-weight="700" x="24" y="34">Cheatsheet — Cattle List View</text><text fill="#5c5c5c" font-size="12" x="24" y="54">What a designer can change with standard Salesforce config (no code).</text><rect fill="#f3f4f4" height="624" rx="6" stroke="#c9c9c9" width="600" x="24" y="70"/><rect fill="#fff" height="40" rx="6" stroke="#e3e3e3" width="600" x="24" y="70"/><path d="m40 80h4v20h-4z" fill="#008938"/><text fill="#0b0c0c" font-size="7" font-weight="700" x="50" y="86">Animal &amp;</text><text fill="#0b0c0c" font-size="7" font-weight="700" x="50" y="94">Plant Health</text><text fill="#0b0c0c" font-size="7" font-weight="700" x="50" y="102">Agency</text><rect fill="#f3f3f3" height="20" rx="10" stroke="#d8d8d8" width="230" x="210" y="80"/><circle cx="224" cy="90" fill="none" r="4" stroke="#9a9a9a"/><text fill="#9a9a9a" font-size="9" x="236" y="93">Search Bovine TB and more…</text><circle cx="600" cy="90" fill="#c9c9c9" r="9"/><path d="m24 110h600v30h-600z" fill="#008938"/><text fill="#fff" font-size="12" font-weight="700" x="40" y="129">Bovine TB</text><g fill="#fff"><path d="m132 120h3v3h-3z"/><path d="m137 120h3v3h-3z"/><path d="m142 120h3v3h-3z"/><path d="m132 125h3v3h-3z"/><path d="m137 125h3v3h-3z"/><path d="m142 125h3v3h-3z"/><path d="m132 130h3v3h-3z"/><path d="m137 130h3v3h-3z"/><path d="m142 130h3v3h-3z"/></g><text fill="#fff" font-size="10" font-weight="700" x="170" y="129">Cattle</text><path d="m168 137h40v2h-40z" fill="#fff"/><text fill="#d6f0e6" font-size="10" x="224" y="129">Vaccinations</text><text fill="#d6f0e6" font-size="10" x="300" y="129">Reports</text><text fill="#d6f0e6" font-size="10" x="352" y="129">Styleguide</text><text fill="#d6f0e6" font-size="10" x="416" y="129">Configurable</text><rect fill="#fff" height="522" rx="4" stroke="#ddd" width="568" x="40" y="156"/><rect fill="#008938" height="26" rx="4" width="26" x="52" y="168"/><text fill="#0b0c0c" font-size="13" font-weight="700" x="88" y="180">Cattle</text><text fill="#5c5c5c" font-size="8" x="88" y="192">All Cattle • List View • 5 items</text><rect fill="#008938" height="22" rx="4" width="116" x="430" y="168"/><text fill="#fff" font-size="9" font-weight="700" text-anchor="middle" x="488" y="183">Log a Vaccination</text><rect fill="#fff" height="22" rx="4" stroke="#b9b9b9" width="44" x="552" y="168"/><text fill="#0b0c0c" font-size="9" text-anchor="middle" x="574" y="183">New</text><rect fill="#fff" height="22" rx="4" stroke="#c9c9c9" width="230" x="52" y="206"/><circle cx="66" cy="217" fill="none" r="4" stroke="#9a9a9a"/><text fill="#9a9a9a" font-size="9" x="78" y="220">Search by ear tag…</text><path d="m52 244h544v22h-544z" fill="#fafafa" stroke="#ececec"/><rect fill="#fff" height="9" rx="2" stroke="#b9b9b9" width="9" x="60" y="251"/><g font-weight="700"><text fill="#444" font-size="8.5" x="80" y="258">EAR TAG NUMBER</text><text fill="#444" font-size="8.5" x="220" y="258">TB VAX</text><text fill="#444" font-size="8.5" x="300" y="258">DOB</text><text fill="#444" font-size="8.5" x="380" y="258">SEX</text><text fill="#444" font-size="8.5" x="450" y="258">BREED</text><text fill="#888" font-size="10" x="566" y="258">▾</text></g><g fill="#0b0c0c" font-size="9"><path d="m52 266h544" stroke="#ececec"/><text x="80" y="282">UK582910001<tspan font-weight="700">25</tspan></text><text x="220" y="282">Vaccinated</text><text x="300" y="282">14 Mar 2021</text><text x="380" y="282">Female</text><text x="450" y="282">HER</text><text fill="#888" x="566" y="282">▾</text><path d="m52 290h544v22h-544z" fill="#f8f8f8"/><text x="80" y="305">UK582910001<tspan font-weight="700">26</tspan></text><text x="220" y="305">Due Soon</text><text x="300" y="305">02 Jun 2022</text><text x="380" y="305">Female</text><text x="450" y="305">BALX</text><text fill="#888" x="566" y="305">▾</text><text x="80" y="328">UK582910001<tspan font-weight="700">29</tspan></text><text x="220" y="328">Overdue</text><text x="300" y="328">30 Jul 2021</text><text x="380" y="328">Female</text><text x="450" y="328">LIMX</text><text fill="#888" x="566" y="328">▾</text></g><g fill="#fff" font-size="11" font-weight="700" text-anchor="middle"><circle cx="44" cy="74" fill="#2e844a" r="11"/><text x="44" y="78">1</text><circle cx="206" cy="80" fill="#ba0517" r="11"/><text x="206" y="84">2</text><circle cx="40" cy="124" fill="#2e844a" r="11"/><text x="40" y="128">3</text><circle cx="52" cy="162" fill="#9a6a00" r="11"/><text x="52" y="166">4</text><circle cx="430" cy="160" fill="#9a6a00" r="11"/><text x="430" y="164">5</text><circle cx="52" cy="206" fill="#2e844a" r="11"/><text x="52" y="210">6</text><circle cx="120" cy="244" fill="#2e844a" r="11"/><text x="120" y="248">7</text><circle cx="220" cy="276" fill="#ba0517" r="11"/><text x="220" y="280">8</text><circle cx="596" cy="276" fill="#2e844a" r="11"/><text x="596" y="280">9</text></g><text fill="#0b0c0c" font-size="13" font-weight="700" x="660" y="86">What you can change</text><circle cx="666" cy="104" fill="#2e844a" r="6"/><text fill="#444" font-size="10" x="678" y="108">Configurable</text><circle cx="788" cy="104" fill="#9a6a00" r="6"/><text fill="#444" font-size="10" x="800" y="108">Partial</text><circle cx="880" cy="104" fill="#ba0517" r="6"/><text fill="#444" font-size="10" x="892" y="108">Needs code</text><g font-size="11.5"><circle cx="668" cy="138" fill="#2e844a" r="10"/><text fill="#fff" font-size="10" font-weight="700" text-anchor="middle" x="668" y="142">1</text><text fill="#0b0c0c" font-weight="700" x="688" y="135">Logo</text><text fill="#5c5c5c" x="688" y="150">Setup → Themes and Branding → Logo image.</text><circle cx="668" cy="178" fill="#ba0517" r="10"/><text fill="#fff" font-size="10" font-weight="700" text-anchor="middle" x="668" y="182">2</text><text fill="#0b0c0c" font-weight="700" x="688" y="175">Global search</text><text fill="#5c5c5c" x="688" y="190">Always present — position &amp; style are fixed; can’t move it.</text><circle cx="668" cy="218" fill="#2e844a" r="10"/><text fill="#fff" font-size="10" font-weight="700" text-anchor="middle" x="668" y="222">3</text><text fill="#0b0c0c" font-weight="700" x="688" y="215">Brand colour + app name &amp; tabs</text><text fill="#5c5c5c" x="688" y="230">Themes &amp; Branding (colour) · App Manager (name, nav items).</text><circle cx="668" cy="258" fill="#9a6a00" r="10"/><text fill="#fff" font-size="10" font-weight="700" text-anchor="middle" x="668" y="262">4</text><text fill="#0b0c0c" font-weight="700" x="688" y="255">List title + object icon</text><text fill="#5c5c5c" x="688" y="270">Rename object label · icon chosen from standard set (Tab Style).</text><circle cx="668" cy="298" fill="#9a6a00" r="10"/><text fill="#fff" font-size="10" font-weight="700" text-anchor="middle" x="668" y="302">5</text><text fill="#0b0c0c" font-weight="700" x="688" y="295">Page buttons (actions)</text><text fill="#5c5c5c" x="688" y="310">Create Actions/Buttons (Object Manager). Colour is automatic.</text><circle cx="668" cy="338" fill="#2e844a" r="10"/><text fill="#fff" font-size="10" font-weight="700" text-anchor="middle" x="668" y="342">6</text><text fill="#0b0c0c" font-weight="700" x="688" y="335">Search this list</text><text fill="#5c5c5c" x="688" y="350">Standard list-view search — appears automatically.</text><circle cx="668" cy="378" fill="#2e844a" r="10"/><text fill="#fff" font-size="10" font-weight="700" text-anchor="middle" x="668" y="382">7</text><text fill="#0b0c0c" font-weight="700" x="688" y="375">Columns, sort &amp; filter</text><text fill="#5c5c5c" x="688" y="390">List View Controls → Select Fields to Display / Filters.</text><circle cx="668" cy="418" fill="#ba0517" r="10"/><text fill="#fff" font-size="10" font-weight="700" text-anchor="middle" x="668" y="422">8</text><text fill="#0b0c0c" font-weight="700" x="688" y="415">Status value</text><text fill="#5c5c5c" x="688" y="430">Shows as plain text (picklist/formula). Coloured badge needs code.</text><circle cx="668" cy="458" fill="#2e844a" r="10"/><text fill="#fff" font-size="10" font-weight="700" text-anchor="middle" x="668" y="462">9</text><text fill="#0b0c0c" font-weight="700" x="688" y="455">Row action menu</text><text fill="#5c5c5c" x="688" y="470">Configure list-view row actions (View, Edit, custom).</text></g><rect fill="#fef6f6" height="86" rx="6" stroke="#f3c4c4" width="452" x="660" y="500"/><text fill="#ba0517" font-size="11.5" font-weight="700" x="676" y="522">Can’t change without code</text><text fill="#5c5c5c" font-size="11" x="676" y="540">• Reposition elements freely / custom grid or column widths</text><text fill="#5c5c5c" font-size="11" x="676" y="556">• Move or restyle the global search</text><text fill="#5c5c5c" font-size="11" x="676" y="572">• Coloured status badges, custom fonts, link colours</text></svg>